name: Update formula on new Aura release

on:
  repository_dispatch:
    types: [aura-macos-release]
  workflow_dispatch:
    inputs:
      version:
        description: "Aura version to update (e.g., 1.1.2)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  update-formula:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Determine version
        id: version
        run: |
          if [[ -n "${{ github.event.client_payload.version }}" ]]; then
            VERSION="${{ github.event.client_payload.version }}"
          else
            VERSION="${{ inputs.version }}"
          fi
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "Version: ${VERSION}"

      - name: Download and calculate SHA256
        id: sha256
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          URL="https://github.com/debugly/fsplayer/releases/download/Aura-macos-${VERSION}/Aura-macos-${VERSION}.zip"
          echo "Downloading: $URL"
          curl -L -o "Aura-macos-${VERSION}.zip" "$URL" || { echo "::error::Failed to download $URL"; exit 1; }
          SHA256=$(shasum -a 256 "Aura-macos-${VERSION}.zip" | awk '{print $1}')
          echo "sha256=${SHA256}" >> $GITHUB_OUTPUT
          echo "SHA256: ${SHA256}"
          rm "Aura-macos-${VERSION}.zip"

      - name: Update formula
        env:
          VERSION: ${{ steps.version.outputs.version }}
          SHA256: ${{ steps.sha256.outputs.sha256 }}
        run: |
          cat > Casks/aura.rb << 'RUBY'
          cask "aura" do
            version "${VERSION}"
            sha256 "${SHA256}"

            url "https://github.com/debugly/fsplayer/releases/download/Aura-macos-#{version}/Aura-macos-#{version}.zip"
            name "Aura"
            desc "Multi-platform video player based on ijkplayer"
            homepage "https://github.com/debugly/fsplayer"

            app "AuraPlayer.app"

            zap trash: [
              "~/Library/Preferences/cn.debugly.AuraPlayer.plist",
              "~/Library/Caches/cn.debugly.AuraPlayer",
              "~/Library/Application Support/CrashReporter/AuraPlayer*",
            ]
          end
          RUBY

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Casks/aura.rb
          git commit -m "chore: update aura to ${{ steps.version.outputs.version }}" || echo "No changes to commit"
          git push
